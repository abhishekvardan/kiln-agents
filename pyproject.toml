[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiln-agents"
version = "0.2.0"
description = "A native Python port of kiln — build and orchestrate AI agents: unified providers (OpenAI/Groq/Ollama), a tool-calling loop, self-correcting structured output, ctx.team.ask() dynamic collaboration, full structured runtime traces, MCP support, and a DAG orchestrator."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abhishek Vardan Botta" }]
requires-python = ">=3.10"
keywords = ["kiln", "ai", "agent", "agents", "framework", "orchestration", "llm", "openai", "groq", "ollama", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "mcp>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/abhishekvardanbotta/kiln"
Repository = "https://github.com/abhishekvardanbotta/kiln"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln_agents"]
